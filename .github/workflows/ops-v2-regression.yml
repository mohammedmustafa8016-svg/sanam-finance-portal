name: Ops Control V2 Regression
on:
  push:
    branches: [feature-ops-control-v2-2026-09-14]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static protected baseline and feature checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'OPS_CONTROL_V2_2026_09_14','data-page="control"','data-page="workload"','data-page="escalations"','data-page="automation"',
            'openHeaderFilter','filter-arrow','SAVED_VIEWS','get_supervisor_control_center','get_workload_capacity','get_escalation_center','get_automation_health',
            'openPerformanceDrilldown','mark_task_blocker','review_finance_task','openCapacitySettings',
            'PAYMENT_REPORT_COLUMNS','paymentReportPrintableHtml','deleteRequestedPayment','deleteBankAccount','moneyHtml','toggleLanguage',
            'monthly_close_tasks','imprest_funds','ownership_matrix','team_performance'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'Missing protected/features: {missing}'
          assert 'column-filter-row' not in s, 'Old always-visible filter row still present'
          assert 'input class="column-filter"' not in s, 'Old filter inputs still present'
          assert 'رقم الحساب / IBAN' in s and 'maskAccountNo' in s, 'Masked bank account behavior missing'
          assert "status='بانتظار المراجعة'" not in s or 'reviewTask' in s
          print('Ops Control V2 static regression: PASS')
          PY
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/app.js').write_text(inline)
          PY
          node --check /tmp/app.js
