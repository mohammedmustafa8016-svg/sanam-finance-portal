name: Daily Operations Workflow V4 Patch
on:
  push:
    branches: [daily-operations-workflow-v4-20260917]
    paths:
      - 'scripts/patch_daily_operations_v4.py'
      - 'scripts/fix_daily_operations_v4_patch.py'
      - '.github/workflows/daily-operations-v4-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daily-operations-workflow-v4-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V4 UI patch
        run: |
          python scripts/patch_daily_operations_v4.py
          python scripts/fix_daily_operations_v4_patch.py
      - name: Validate V4 anchors
        run: |
          grep -q 'DAILY_OPERATIONS_WORKFLOW_V4_2026_09_17' index.html
          grep -q 'get_workcenter_items_v4' index.html
          grep -q 'get_team_operations_monitor_v4' index.html
          grep -q 'try_perform_work_item_action_v4' index.html
          grep -q 'submit_finance_task_result' index.html
          grep -q 'review_finance_task_scored' index.html
          grep -q 'teamOperationsMonitorBody' index.html
          grep -q 'openEmployeePerformanceReport' index.html
          grep -q 'wcWorkdayStatus' index.html
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip() and 'src=' not in x[:80]]
          Path('/tmp/app.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit V4 UI
        run: |
          git config user.name 'Sanam Finance Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Unify daily task execution and team performance monitor'
          git push origin HEAD:daily-operations-workflow-v4-20260917
