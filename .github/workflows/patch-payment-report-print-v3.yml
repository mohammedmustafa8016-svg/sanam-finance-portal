name: Patch payment report print layout v3

on:
  push:
    branches: [dev-payment-report-print-review]
    paths:
      - '.github/workflows/patch-payment-report-print-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-payment-report-print-review
      - name: Patch printable report
        env:
          REPLACEMENT_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re,os
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          replacement=base64.b64decode(os.environ['REPLACEMENT_B64']).decode('utf-8')
          pattern=r'function paymentReportPrintableHtml\(\)\{.*?\nfunction printPaymentReport\(\)'
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'target replace count={n}')
          p.write_text(ns,encoding='utf-8')
          script=re.search(r'<script>(.*)</script>',ns,re.S)
          Path('/tmp/app.js').write_text(script.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 'Sanam Finance Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve payment report print and PDF layout' || exit 0
          git push
