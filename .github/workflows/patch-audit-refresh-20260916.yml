name: Patch Audit Refresh 20260916
on:
  push:
    branches: [fix-audit-refresh-2026-09-16]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-audit-refresh-2026-09-16
      - run: python scripts/patch_audit_refresh_20260916.py
      - name: Validate audit refresh and protected baseline
        run: |
          grep -q 'AUDIT_REFRESH_FIX_2026_09_16' index.html
          grep -q 'auditRefreshBtn' index.html
          grep -q 'auditRefreshStatus' index.html
          grep -q 'applyTableFilters(table)' index.html
          grep -q 'FILTER_RESERVE_PENDING_2026_09_16' index.html
          grep -q 'DAILY_PLAN_POLICIES_2026_09_16' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit patched UI
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix audit refresh feedback and filter reapply [skip patch]'
          git push
