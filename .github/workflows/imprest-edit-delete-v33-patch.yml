name: Imprest Edit Delete V3.3 Patch
on:
  push:
    branches: [imprest-edit-delete-v33-20260917]
    paths:
      - 'scripts/patch_imprest_edit_delete_v33.py'
      - '.github/workflows/imprest-edit-delete-v33-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imprest-edit-delete-v33-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI patch
        run: python scripts/patch_imprest_edit_delete_v33.py
      - name: Validate anchors
        run: |
          grep -q 'IMPREST_EDIT_DELETE_V33_2026_09_17' index.html
          grep -q "function openImprestModal(id='')" index.html
          grep -q 'function deleteImprest' index.html
          grep -q "sb.rpc('update_imprest_fund'" index.html
          grep -q "sb.rpc('delete_imprest_fund'" index.html
          grep -q "openImprestModal('${x.id}')" index.html
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip() and 'src=' not in x[:80]]
          Path('/tmp/app.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patched UI
        run: |
          git config user.name 'Sanam Finance Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add edit and safe delete actions for imprest accounts'
          git push origin HEAD:imprest-edit-delete-v33-20260917
