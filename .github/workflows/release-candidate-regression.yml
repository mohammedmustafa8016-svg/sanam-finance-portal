name: Release Candidate Regression

on:
  push:
    branches: [release-candidate-2026-09-14]
    paths:
      - 'index.html'
      - '.github/workflows/release-candidate-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-candidate-2026-09-14

      - name: Protected application baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required_pages=['dashboard','banks','payments','posted','tasks','close','imprest','performance','ownership','exceptions','audit']
          for x in required_pages:
              assert f'id="{x}"' in s, f'missing page {x}'
          for role in ['CFO','Supervisor','BankAccountant','GLAccountant','ARAccountant','APAccountant']:
              assert role in s, f'missing role {role}'
          functions=['openBankModal','saveBank','openPaymentModal','savePayment','supervisorApprove','cfoApprove','executePayment','postPayment','openTaskModal','saveTask','openCloseModal','saveClose','openImprestModal','saveImprest','openExceptionModal','saveException','loadAudit','openPaymentReport','previewPaymentReport','exportPaymentReportCsv','printPaymentReport','copyPaymentReportEmailSummary','toggleLanguage','applyLanguage']
          for fn in functions:
              assert re.search(rf'(async\s+)?function\s+{fn}\s*\(',s), f'missing function {fn}'
          bilingual=['id="authLangBtn"','id="langBtn"','const I18N_AR_EN=','BILINGUAL_EXTENSIONS_APPLIED','Financial Control Center','Chief Financial Officer','Accounts Supervisor']
          for x in bilingual:
              assert x in s, f'missing bilingual invariant {x}'
          reports=['id="paymentReportBtn"','pr_from','pr_to','pr_company','pr_status','pr_bank','PAYMENT_REPORT_COLUMNS','Export CSV','Print / PDF','Copy Email Summary']
          for x in reports:
              assert x in s, f'missing report invariant {x}'
          assert 'paymentReportBtn.classList.toggle("hidden",!["CFO","Supervisor","BankAccountant"].includes(profile.role))' in s, 'report role permission changed'
          assert 'audit_log_actor_id_fkey' in s and 'entity_type' in s, 'audit log fix missing'
          assert '.negative-amount' in s and 'font-weight:700' in s, 'negative style missing'
          assert '${moneyHtml(n)}' not in s, 'recursive money formatter regression'
          assert 'addEventListener("click",openBankModal)' not in s, 'duplicate bank click regression'
          assert 'supervisor_approve_payment' in s and 'cfo_approve_payment' in s and 'execute_payment' in s and 'post_payment' in s, 'payment RPC linkage changed'
          assert "if(/^[=+@-]/.test(x)" in s, 'CSV formula injection protection missing'
          expected={
          'CFO':'["dashboard","banks","payments","posted","tasks","close","imprest","performance","ownership","exceptions","audit"]',
          'Supervisor':'["dashboard","banks","payments","posted","tasks","close","imprest","performance","ownership","exceptions"]',
          'BankAccountant':'["dashboard","banks","payments","posted","tasks","close","imprest","exceptions"]',
          'GLAccountant':'["dashboard","payments","posted","tasks","close","exceptions"]',
          'ARAccountant':'["dashboard","tasks","close","performance","exceptions"]',
          'APAccountant':'["dashboard","payments","posted","tasks","close","imprest","performance","exceptions"]'}
          for role,arr in expected.items():
              assert f'{role}:{arr}' in s, f'page access regression for {role}'
          print('Protected application baseline: PASS')
          PY

      - name: Payment report print and export regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required={
            'date-from filter':"val('pr_from')",
            'date-to filter':"val('pr_to')",
            'company filter':"val('pr_company')",
            'status filter':"val('pr_status')",
            'bank filter':"val('pr_bank')",
            'landscape threshold':'const landscape=cols.length>7;',
            'adaptive A4':'@page{size:A4 ${landscape?',
            'Dubai font':'font-family:"Dubai","Segoe UI","Noto Sans Arabic"',
            'RTL/LTR':"const dir=currentLang==='en'?'ltr':'rtl'",
            'period in print':'[labels.period,`${from} → ${to}`]',
            'company in print':'[labels.company,company]',
            'status in print':'[labels.status,status]',
            'bank in print':'[labels.bank,bank]',
            'repeat table header':'thead{display:table-header-group}',
            'avoid row split':'tr{page-break-inside:avoid}',
            'negative print styling':'.neg{color:#a43f3f;font-weight:700}',
            'valid wrapping':'overflow-wrap:anywhere}th{',
            'csv utf8 bom':"'\\ufeff'+lines.join",
            'csv formula protection':"if(/^[=+@-]/.test(x)",
          }
          missing=[k for k,v in required.items() if v not in s]
          if missing: raise SystemExit('Missing report controls: '+', '.join(missing))
          assert 'overflow-wrap:anywher}}' not in s, 'malformed print CSS returned'
          m=re.search(r'const PAYMENT_REPORT_COLUMNS=\[(.*?)\];',s,re.S)
          assert m and m.group(1).count('{key:')==13, 'expected 13 report columns'
          print('Payment report regression: PASS')
          PY

      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/sanam-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sanam-inline.js

      - name: Release scope guard
        run: |
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/release-candidate-regression.yml\nindex.html'
          echo 'Release candidate scope: PASS'
