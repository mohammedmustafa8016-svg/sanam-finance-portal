name: CFO Monitor Reserve Regression
on:
  push:
    branches: [feature-cfo-monitor-reserve-accounts-2026-09-15]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static feature and protected-baseline checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'CFO_MONITOR_RESERVES_2026_09_15','CFO Financial & Operations Monitor','kpiTotalBankCash','kpiOperationalLiquidity','kpiWorkingCapital','kpiVatReserve','kpiNetOperational',
            'ACCOUNT_TYPES','Working Capital Reserve','VAT Reserve','Restricted / Other','get_reserve_account_monitor','record_reserve_movement','openReserveMovement','isProtectedBank',
            'WARNING: This is a protected','نوع الحساب البنكي','reserveMonitorCards',
            'OPS_CONTROL_V2_2026_09_14','get_supervisor_control_center','get_workload_capacity','get_escalation_center','get_automation_health',
            'PAYMENT_REPORT_COLUMNS','paymentReportPrintableHtml','deleteRequestedPayment','deleteBankAccount','openHeaderFilter','filter-arrow',
            'monthly_close_tasks','imprest_funds','ownership_matrix','openPerformanceDrilldown','review_finance_task','mark_task_blocker'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'Missing features/baseline: {missing}'
          assert 'bank_accounts(company,bank_name,account_name,account_type)' in s
          m=Path('supabase/migrations/20260915_cfo_monitor_reserve_accounts.sql').read_text()
          for x in ['add column if not exists account_type','bank_reserve_movements','get_reserve_account_monitor','record_reserve_movement','BANK_ACCOUNT_TYPE_CHANGED']:
            assert x in m, x
          print('CFO monitor reserve static regression: PASS')
          PY
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip() and 'src=' not in x[:80])
          Path('/tmp/app.js').write_text(inline)
          PY
          node --check /tmp/app.js
