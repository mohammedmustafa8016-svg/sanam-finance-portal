name: Patch finance operations control
on:
  push:
    branches:
      - feature-finance-ops-control-2026-09-14
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize patch substitutions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_finance_ops_control.py')
          s=p.read_text()
          for name in ('reload','bank','task','close','imprest','perf'):
              s=s.replace(f're.subn({name}_re,{name}_new,s,',f're.subn({name}_re,lambda m: {name}_new,s,')
          p.write_text(s)
          PY
      - name: Patch portal UI
        run: python scripts/patch_finance_ops_control.py
      - name: Validate JavaScript
        run: node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\\s\\S]*)<\\/script>/);if(!m)throw new Error('script block missing');new Function(m[1]);console.log('javascript syntax PASS')"
      - name: Commit patch
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name "sanam-automation"
          git config user.email "sanam-automation@users.noreply.github.com"
          git add index.html
          git commit -m "Add finance operations control dashboard features"
          git push
