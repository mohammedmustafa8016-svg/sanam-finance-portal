name: Delete Actions Regression
on:
  push:
    branches: [feature-delete-bank-payment-2026-09-14]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend and migration
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          sql=Path('supabase/migrations/20260914_add_safe_delete_bank_payment.sql').read_text()
          must_html=[
            'deleteBankAccount',
            'deleteRequestedPayment',
            'delete_bank_account',
            'delete_requested_payment',
            '["CFO","Supervisor","BankAccountant"]',
            'p.executed_at||p.posted_at||p.status==="مرحّل"',
            'DELETE_BANK_PAYMENT_ACTIONS_2026_09_14',
            'I18N_AR_EN["حذف"]="Delete"'
          ]
          must_sql=[
            "v_role not in ('CFO','Supervisor','BankAccountant')",
            "Executed or posted payments cannot be deleted",
            "Bank account cannot be deleted while payment records reference it",
            "DELETE_REQUESTED_PAYMENT",
            "DELETE_BANK_ACCOUNT",
            "grant execute on function public.delete_requested_payment(uuid) to authenticated",
            "grant execute on function public.delete_bank_account(uuid) to authenticated"
          ]
          missing=[x for x in must_html if x not in html]+[x for x in must_sql if x not in sql]
          if missing: raise SystemExit('Missing required guards: '+repr(missing))
          if 'onclick="deleteRequestedPayment' not in html or 'onclick="deleteBankAccount' not in html:
            raise SystemExit('Delete buttons are not wired')
          print('static delete regression PASS')
          PY
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\s\S]*)<\/script>/);if(!m)throw new Error('script block missing');new Function(m[1]);console.log('javascript syntax PASS')"
