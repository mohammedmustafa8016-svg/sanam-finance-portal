name: Payment Imprest V3.2 Patch
on:
  push:
    branches: [payment-imprest-workflow-v32-20260917]
    paths:
      - 'scripts/patch_payment_imprest_v32.py'
      - '.github/workflows/payment-imprest-v32-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: payment-imprest-workflow-v32-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI patch
        run: python scripts/patch_payment_imprest_v32.py
      - name: Validate required anchors
        run: |
          grep -q 'data-page="executed"' index.html
          grep -q 'id="executedPaymentsTable"' index.html
          grep -q 'function renderExecutedPayments' index.html
          grep -q 'function openImprestSettlementModal' index.html
          grep -q 'get_imprest_settlement_register' index.html
          grep -q 'get_imprest_fund_summary' index.html
          if grep -q 'id="accountingQueuePanel"' index.html; then echo 'duplicate accounting queue still present'; exit 1; fi
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip() and 'src=' not in x[:80]]
          Path('/tmp/app.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patched UI
        run: |
          git config user.name 'Sanam Finance Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Split payment lifecycle and add imprest settlement workflow UI'
          git push origin HEAD:payment-imprest-workflow-v32-20260917
