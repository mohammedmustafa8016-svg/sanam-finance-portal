name: Task Management V2 Release Validation

on:
  push:
    branches:
      - task-management-v2-release-20260917
    paths:
      - '.github/workflows/task-v2-release-20260917.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-management-v2-release-20260917
          fetch-depth: 0
      - name: Reconstruct and apply tested frontend patch
        shell: bash
        run: |
          cat scripts/release_taskv2/patch.part1 scripts/release_taskv2/patch.part2 scripts/release_taskv2/patch.part3 scripts/release_taskv2/patch.part4 > /tmp/taskv2.patch.gz.b64
          base64 -d /tmp/taskv2.patch.gz.b64 | gzip -d > /tmp/taskv2.patch
          git apply --check /tmp/taskv2.patch
          git apply /tmp/taskv2.patch
      - name: Validate protected baseline and Task Management V2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html').read_text(encoding='utf-8')
          assert 'GeneralManager' not in p
          assert "['CFO','Supervisor'].includes(profile.role)" in p
          assert 'get_task_operational_start_date' in p
          assert 'get_task_thread' in p
          assert 'request_task_extension' in p
          assert 'decide_task_extension' in p
          assert 'reassign_finance_task' in p
          assert 'update_finance_task_v2' in p
          assert 'start_workday' in p and 'end_workday' in p
          assert 'n.message||n.body' in p
          assert 'numberingSystem:"latn"' in p
          assert 'save_manual_daily_plan' in p
          assert 'save_as_template' in p
          assert 'set_finance_automation_state' not in p
          sections=re.findall(r'<section id="([^"]+)"',p)
          assert len(set(sections))>=17
          print('Static acceptance checks passed:', len(set(sections)), 'sections')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S)
          js='\n'.join(b for b in blocks if b.strip())
          Path('/tmp/sanam-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/sanam-inline.js
          test -f supabase/migrations/20260917_task_management_v2_integrated_compatibility.sql
          ! grep -Eiq '\b(DROP TABLE|DROP COLUMN|TRUNCATE|DELETE FROM)\b' supabase/migrations/20260917_task_management_v2_integrated_compatibility.sql
      - name: Commit validated release frontend
        shell: bash
        run: |
          git config user.name 'Sanam Finance Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release Task Management V2 integrated frontend'
          git push origin HEAD:task-management-v2-release-20260917
