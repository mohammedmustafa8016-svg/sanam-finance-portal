name: Patch Universal Column Customization
on:
  push:
    branches: [feature-universal-column-customization-2026-09-15]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-universal-column-customization-2026-09-15
      - run: python scripts/patch_universal_column_customization.py
      - name: Validate universal column UI and JS syntax
        run: |
          grep -q 'UNIVERSAL_COLUMN_CUSTOMIZATION_2026_09_15' index.html
          grep -q 'installUniversalColumnCustomizers' index.html
          grep -q 'data-default-hidden="1">الغرض' index.html
          grep -q 'documents_status' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit patched UI
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add universal column customization [skip patch]'
          git push
