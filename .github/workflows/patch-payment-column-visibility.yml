name: Patch Payment Column Visibility
on:
  push:
    branches: [feature-payment-column-visibility-2026-09-15]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-payment-column-visibility-2026-09-15
      - run: python scripts/patch_payment_column_visibility.py
      - name: Validate UI patch and JS syntax
        run: |
          grep -q 'PAYMENT_LIST_COLUMN_VISIBILITY_2026_09_15' index.html
          grep -q 'تخصيص الأعمدة' index.html
          grep -q 'paymentsTable' index.html
          grep -q 'openPaymentColumnSettings' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit patched UI
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add configurable payment list columns [skip patch]'
          git push
