name: Migration Rebuild Test

on:
  push:
    branches:
      - integration-workcenter-v5-rebuild
    paths:
      - "supabase/**"
      - ".github/workflows/migration-rebuild-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5

      - name: Production isolation guard
        shell: bash
        run: |
          set -euo pipefail
          PROD_REF="xpomwrpgxnjx""abjnwnuz"
          if grep -F "$PROD_REF" supabase/config.toml; then
            echo "Production project reference detected in local rebuild configuration."
            exit 1
          fi
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Remote Supabase access token must not be present in this rebuild job."
            exit 1
          fi
          if [ -e "supabase/.temp/project-ref" ]; then
            echo "Linked remote project state detected."
            exit 1
          fi

      - name: Pin and verify Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 --version
          npx --yes supabase@2.121.0 start --help >/dev/null
          npx --yes supabase@2.121.0 db reset --help >/dev/null

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 start

      - name: Assert migrations-only release input
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/patches ] && find supabase/patches -type f -print -quit | grep -q .; then
            echo "Active manual patch files detected."
            find supabase/patches -type f -maxdepth 1 -print
            exit 1
          fi
          PATCH_APPLY_NEEDLE="-f supabase""/patches/"
          if grep -R -F -- "$PATCH_APPLY_NEEDLE" .github/workflows; then
            echo "Workflow still applies a manual patch."
            exit 1
          fi
          echo "PASS: no active manual patch files or workflow patch references."

      - name: Fresh rebuild from all official migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 db reset --local

      - name: Verify local migration history is 79
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          COUNT=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from supabase_migrations.schema_migrations;")
          echo "Local migration count: $COUNT"
          test "$COUNT" -eq 79
          npx --yes supabase@2.121.0 migration list --local

      - name: Stop disposable local stack
        if: always()
        shell: bash
        run: npx --yes supabase@2.121.0 stop --no-backup || true
