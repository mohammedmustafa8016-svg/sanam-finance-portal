name: Local Security RLS and UI gates

on:
  push:
    branches: [fix-seed-permissions-migration-20261026, migration-parity-rebuild]
    paths: ['tests/**', 'supabase/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-gates:
    name: Local gates (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [current, baseline]
    env:
      GATE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Guard isolated branch and baseline comparison
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            fix-seed-permissions-migration-20261026|migration-parity-rebuild) ;;
            *) echo "Local regression workflow is restricted to review branches"; exit 1 ;;
          esac
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GATE_VARIANT" = baseline ]; then
            rm supabase/migrations/20261026095100_fix_seed_permissions_for_user.sql
          fi
          supabase --version
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase status --help >/dev/null
          sha256sum supabase/migrations/*.sql > migration-manifest.txt
      - name: Install pinned browser harness
        timeout-minutes: 5
        run: |
          npm ci --prefix tests/harness --ignore-scripts --no-audit --no-fund
          # Hosted Ubuntu runners already supply Chrome's shared libraries.
          # Keep Playwright's pinned Chromium, without an unbounded apt update.
          tests/harness/node_modules/.bin/playwright install chromium
      - name: Start disposable local Supabase
        run: supabase start
      - name: Rebuild from migrations only without seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-results
          supabase db reset --local --no-seed 2>&1 | tee gate-results/clean-rebuild.log
          cp migration-manifest.txt gate-results/
      - name: Security RLS permissions and browser regression gates
        run: python3 tests/harness/run-gates.py
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-gate-evidence-${{ matrix.variant }}
          path: |
            gate-results/
            tests/*.png
          retention-days: 14
      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup
