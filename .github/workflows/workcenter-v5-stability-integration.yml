name: Work Center V5 Stability Integration

on:
  push:
    branches:
      - integration-workcenter-v5-rebuild
    paths:
      - "supabase/**"
      - "tests/workcenter-v5.sql"
      - "tests/workcenter-v5-performance.sql"
      - "workcenter-v5.js"
      - ".github/workflows/workcenter-v5-stability-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workcenter-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5

      - name: Production isolation guard
        shell: bash
        run: |
          set -euo pipefail
          PROD_REF="xpomwrpgxnjx""abjnwnuz"
          if grep -R -F "$PROD_REF" supabase/config.toml supabase/seed.sql; then
            echo "Production project reference detected in local test configuration."
            exit 1
          fi
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Remote Supabase access token must not be present."
            exit 1
          fi
          if [ -e "supabase/.temp/project-ref" ]; then
            echo "Linked remote project state detected."
            exit 1
          fi

      - name: Pin Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 --version

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 start

      - name: Rebuild all 72 migrations locally
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 db reset --local

      - name: Apply development-only Work Center patch locally
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/patches/workcenter_v5_set_based_actions.sql

      - name: Run Work Center functional regression
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          \i tests/workcenter-v5.sql
          rollback;
          SQL

      - name: Run Work Center performance gate
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/workcenter-v5-performance.sql

      - name: Verify local migration history remains 72
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 migration list --local

      - name: Stop disposable local stack
        if: always()
        shell: bash
        run: npx --yes supabase@2.121.0 stop --no-backup || true
