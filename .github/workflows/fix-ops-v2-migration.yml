name: Fix ops v2 migration
on:
  push:
    branches: [feature-ops-control-v2-2026-09-14]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'sanam-automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260914_ops_control_v2.sql')
          s=p.read_text()
          needle='create or replace function public.get_finance_team_performance()'
          repl='drop function if exists public.get_finance_team_performance();\n\n'+needle
          if 'drop function if exists public.get_finance_team_performance();' not in s:
              if needle not in s: raise SystemExit('anchor missing')
              s=s.replace(needle,repl,1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet -- supabase/migrations/20260914_ops_control_v2.sql; then exit 0; fi
          git config user.name "sanam-automation"
          git config user.email "sanam-automation@users.noreply.github.com"
          git add supabase/migrations/20260914_ops_control_v2.sql
          git commit -m "Fix performance RPC return type migration"
          git push
