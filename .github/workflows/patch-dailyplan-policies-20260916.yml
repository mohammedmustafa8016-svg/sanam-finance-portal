name: Patch Daily Plan Policies 20260916
on:
  push:
    branches: [feature-dailyplan-policies-2026-09-16]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-dailyplan-policies-2026-09-16
      - run: python scripts/patch_dailyplan_policies_20260916.py
      - name: Validate protected baseline and additions
        run: |
          grep -q 'DAILY_PLAN_POLICIES_2026_09_16' index.html
          grep -q 'save_enhanced_daily_plan' index.html
          grep -q 'finance_task_catalog' index.html
          grep -q 'get_finance_policy_register' index.html
          grep -q 'acknowledge_finance_policy' index.html
          grep -q 'CFO_CONTROLS_RESERVE_RECOVERY_2026_09_16' index.html
          grep -q 'UNIVERSAL_COLUMN_CUSTOMIZATION_2026_09_15' index.html
          grep -q 'openPaymentReport' index.html
          grep -q 'openReserveReports' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit patched UI
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add enhanced daily plan and finance policies UI [skip patch]'
          git push
