name: Sanam Finance Regression

on:
  push:
    branches: [dev-baseline-restoration-2026-09-14]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run protected baseline tests
        run: python tests/regression.py
