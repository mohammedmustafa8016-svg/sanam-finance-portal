name: Work Center V3.1 UI Patch
on:
  push:
    branches: [work-center-v31-rule-engine-20260917]
    paths:
      - 'scripts/patch_workcenter_v31_actions.py'
      - '.github/workflows/workcenter-v31-ui-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-center-v31-rule-engine-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI patch
        run: python scripts/patch_workcenter_v31_actions.py
      - name: Validate markers and syntax surface
        run: |
          grep -q 'WORK_CENTER_V31_RULE_ACTIONS_2026_09_17' index.html
          grep -q 'openWorkItemActionPanel' index.html
          grep -q 'perform_work_item_action' index.html
      - name: Commit patched UI
        run: |
          git config user.name 'Sanam Finance Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate Work Center V3.1 rule actions into UI' || exit 0
          git push origin HEAD:work-center-v31-rule-engine-20260917
