name: Restore bilingual UI and payment reports

on:
  push:
    branches: [dev-baseline-restoration-2026-09-14]
    paths:
      - '.github/workflows/restore-reports-bilingual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-baseline-restoration-2026-09-14

      - name: Restore protected baseline features
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Direction-aware styling and report styling
          css_anchor='@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.g4,.g2{grid-template-columns:1fr 1fr}}'
          css_add='''[dir="ltr"] .nav,[dir="ltr"] th,[dir="ltr"] td{text-align:left}\n[dir="ltr"] .side{direction:ltr}\n.lang-actions{display:flex;gap:8px;align-items:center}\n.report-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}\n.report-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}\n.report-columns label{display:flex;align-items:center;gap:6px;margin:0;padding:7px;border:1px solid var(--border);border-radius:6px;background:#fafbfc}\n.report-columns input{width:auto}\n.report-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}\n.report-summary .card{padding:12px}\n@media(max-width:620px){.report-columns,.report-summary{grid-template-columns:1fr}}\n'''
          if '[dir="ltr"] .nav' not in s:
              assert css_anchor in s
              s=s.replace(css_anchor,css_add+css_anchor,1)

          # 2) Top language toggle (keep logout)
          old='<button id="logoutBtn" class="btn">تسجيل الخروج</button></div><div class="content">'
          new='<div class="lang-actions"><button id="langBtn" class="btn" type="button" onclick="toggleLanguage()">English</button><button id="logoutBtn" class="btn">تسجيل الخروج</button></div></div><div class="content">'
          if 'id="langBtn"' not in s:
              assert old in s
              s=s.replace(old,new,1)

          # 3) Payment report button: does not alter existing add button or workflow
          old='<section id="payments" class="section"><div class="row" style="margin-bottom:12px"><h3>المدفوعات والاعتمادات</h3><button id="addPaymentBtn" class="btn primary" type="button" onclick="openPaymentModal()">+ إضافة دفعة</button></div>'
          new='<section id="payments" class="section"><div class="row" style="margin-bottom:12px"><h3>المدفوعات والاعتمادات</h3><div class="lang-actions"><button id="paymentReportBtn" class="btn" type="button" onclick="openPaymentReport()">تقرير المدفوعات</button><button id="addPaymentBtn" class="btn primary" type="button" onclick="openPaymentModal()">+ إضافة دفعة</button></div></div>'
          if 'id="paymentReportBtn"' not in s:
              assert old in s
              s=s.replace(old,new,1)

          # 4) Language engine inserted before money formatter; exact dictionaries preserve data and only translate known UI/status terms.
          anchor='const money=n=>new Intl.NumberFormat("ar-SA",{style:"currency",currency:"SAR",maximumFractionDigits:0}).format(Number(n||0));'
          lang_js=r'''let currentLang=localStorage.getItem("sanam_lang")||"ar";
const I18N_AR_EN={
"مركز التحكم المالي":"Financial Control Center","لوحة المعلومات":"Dashboard","السيولة والبنوك":"Liquidity & Banks","المدفوعات والاعتمادات":"Payments & Approvals","المدفوعات المرحلة":"Posted Payments","المهام":"Tasks","الإقفال الشهري":"Monthly Close","العهد":"Imprest","أداء الفريق":"Team Performance","مصفوفة المسؤوليات":"Ownership Matrix","الاستثناءات والإجازات":"Exceptions & Leave","سجل العمليات":"Audit Log","تسجيل الخروج":"Sign out","تسجيل الدخول":"Sign in","تفعيل الحساب لأول مرة":"Activate account first time","البريد الإلكتروني للعمل":"Work email","كلمة المرور":"Password","إجمالي الأرصدة":"Total Balances","الرصيد المحجوز":"Reserved Balance","السيولة المتاحة":"Available Liquidity","بانتظار CFO":"Awaiting CFO","التنبيهات الحالية":"Current Alerts","إضافة حساب":"Add Account","إضافة حساب بنكي":"Add Bank Account","تعديل حساب بنكي":"Edit Bank Account","إضافة دفعة":"Add Payment","تقرير المدفوعات":"Payment Report","إضافة مهمة":"Add Task","إضافة بند إقفال":"Add Close Item","إضافة عهدة":"Add Imprest","إضافة استثناء":"Add Exception","الشركة":"Company","البنك":"Bank","الحساب":"Account","اسم الحساب":"Account Name","رقم الحساب / IBAN":"Account No. / IBAN","الرصيد":"Balance","المحجوز":"Reserved","المتاح":"Available","آخر تحديث":"Last Update","إجراء":"Action","تعديل":"Edit","الاستحقاق":"Due Date","المستفيد":"Beneficiary","المبلغ":"Amount","المشرف":"Supervisor","الحالة":"Status","تاريخ الترحيل":"Posting Date","الغرض":"Purpose","المهمة":"Task","المسؤول":"Owner","المراجع":"Reviewer","الموعد":"Due Date","الأولوية":"Priority","المسار":"Track","الرمز":"Code","البند":"Item","الإنجاز":"Progress","النوع":"Type","العهدة":"Imprest","غير مسوى":"Unsettled","العمر":"Aging","العملية":"Process","النشاط":"Activity","التكرار":"Frequency","المالك":"Owner","المعتمد":"Approver","المخرج":"Output","التاريخ":"Date","المستخدم":"User","الكيان":"Entity","المعرف":"ID","تحديث":"Refresh","إغلاق":"Close","حفظ":"Save","اعتماد المشرف":"Supervisor Approval","اعتماد CFO":"CFO Approval","تم التنفيذ":"Executed","مرحّل":"Posted","موافق":"Approved","معلق":"Pending","بانتظار مراجعة المشرف":"Awaiting Supervisor Review","بانتظار اعتماد CFO":"Awaiting CFO Approval","معتمد للدفع":"Approved for Payment","منفذ":"Executed","مرفوض":"Rejected","موقوف":"On Hold","متأخر":"Overdue","عادي":"Normal","عاجل":"Urgent","حرج":"Critical","عالي":"High","منخفض":"Low","متوسط":"Medium","مكتملة":"Complete","ناقصة":"Incomplete","لم يبدأ":"Not Started","قيد التنفيذ":"In Progress","مكتمل":"Completed","استثناء عام":"General Exception","إجازة موظف + نقل صلاحيات":"Employee Leave + Delegation","الموظف في إجازة":"Employee on Leave","البديل":"Substitute","من":"From","إلى":"To","ملاحظات":"Notes","نوع الاستثناء":"Exception Type","الخطورة":"Severity","التفاصيل":"Details","تقرير المدفوعات الاحترافي":"Professional Payment Report","الفترة من":"Period From","الفترة إلى":"Period To","كل الشركات":"All Companies","كل الحالات":"All Statuses","كل الحسابات":"All Accounts","أعمدة التقرير":"Report Columns","معاينة التقرير":"Preview Report","تصدير CSV":"Export CSV","طباعة / PDF":"Print / PDF","نسخ ملخص للبريد":"Copy Email Summary","عدد الدفعات":"Payment Count","إجمالي المبلغ":"Total Amount","الرصيد المحجوز يُحتسب تلقائياً من المدفوعات غير المنفذة المرتبطة بالحساب البنكي ولا يمكن إدخاله يدويًا.":"Reserved balance is calculated automatically from unexecuted payments linked to the bank account and cannot be entered manually.","الرصيد المحجوز محسوب تلقائيًا من المدفوعات غير المنفذة.":"Reserved balance is calculated automatically from unexecuted payments.","لا توجد استثناءات.":"No exceptions.","لا توجد تنبيهات حالية.":"No current alerts.","لا توجد بيانات بعد.":"No data yet.","تاريخ الاستحقاق":"Due Date","حساب البنك":"Bank Account","المستندات":"Documents","اعتماد المشرف":"Supervisor Approval","اعتماد المدير المالي":"CFO Approval","تاريخ التنفيذ":"Execution Date","تاريخ الترحيل":"Posting Date"
};
const I18N_EN_AR=Object.fromEntries(Object.entries(I18N_AR_EN).map(([a,e])=>[e,a]));
function tr(v){const x=String(v??"");return currentLang==="en"?(I18N_AR_EN[x]||x):(I18N_EN_AR[x]||x)}
function applyLanguage(root=document){
 document.documentElement.lang=currentLang;document.documentElement.dir=currentLang==="en"?"ltr":"rtl";
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
 while(n=walker.nextNode()){if(['SCRIPT','STYLE'].includes(n.parentElement?.tagName))continue;const raw=n.nodeValue;const t=raw.trim();if(!t)continue;const mapped=tr(t);if(mapped!==t)n.nodeValue=raw.replace(t,mapped)}
 root.querySelectorAll?.('[placeholder]').forEach(el=>{const x=el.getAttribute('placeholder');const y=tr(x);if(y!==x)el.setAttribute('placeholder',y)});
 const b=document.getElementById('langBtn');if(b)b.textContent=currentLang==='ar'?'English':'العربية';
}
function toggleLanguage(){currentLang=currentLang==='ar'?'en':'ar';localStorage.setItem('sanam_lang',currentLang);applyLanguage();renderAll();if(document.getElementById('modalBg')?.classList.contains('show'))applyLanguage(document.getElementById('modalBg'))}
function displayText(v){return tr(v)}
'''
          if 'const I18N_AR_EN=' not in s:
              assert anchor in s
              s=s.replace(anchor,lang_js+'\n'+anchor,1)

          # Locale-sensitive currency/date formatting; does not alter values.
          old='const money=n=>new Intl.NumberFormat("ar-SA",{style:"currency",currency:"SAR",maximumFractionDigits:0}).format(Number(n||0));'
          new='const money=n=>new Intl.NumberFormat(currentLang==="en"?"en-SA":"ar-SA",{style:"currency",currency:"SAR",maximumFractionDigits:2}).format(Number(n||0));'
          s=s.replace(old,new,1)
          old='const fmt=d=>d?new Date(d).toLocaleString("ar-SA"):"—";'
          new='const fmt=d=>d?new Date(d).toLocaleString(currentLang==="en"?"en-SA":"ar-SA"):"—";'
          s=s.replace(old,new,1)

          # Make badges bilingual while preserving stored workflow status.
          old='return `<span class="badge ${c}">${esc(s)}</span>`}'
          new='return `<span class="badge ${c}">${esc(displayText(s))}</span>`}'
          if old in s: s=s.replace(old,new,1)

          # Modal translation after generated content is inserted.
          old='titleEl.textContent=t;bodyEl.innerHTML=b;bgEl.classList.add("show")}'
          new='titleEl.textContent=displayText(t);bodyEl.innerHTML=b;bgEl.classList.add("show");applyLanguage(bgEl)}'
          if old in s: s=s.replace(old,new,1)

          # Role labels should follow selected language without changing stored roles.
          old='userRole.textContent=`${profile.full_name} — ${ROLE_LABEL[profile.role]||profile.role}`;applyAccess();await reloadAll()'
          new='userRole.textContent=`${profile.full_name} — ${displayText(ROLE_LABEL[profile.role]||profile.role)}`;applyAccess();await reloadAll();applyLanguage()'
          assert old in s
          s=s.replace(old,new,1)

          # Report button permission: preserve previous role model; reporting limited to CFO, Supervisor and BankAccountant.
          old='addPaymentBtn.classList.toggle("hidden",!["CFO","Supervisor","BankAccountant","APAccountant"].includes(profile.role));addTaskBtn.classList.toggle'
          new='addPaymentBtn.classList.toggle("hidden",!["CFO","Supervisor","BankAccountant","APAccountant"].includes(profile.role));paymentReportBtn.classList.toggle("hidden",!["CFO","Supervisor","BankAccountant"].includes(profile.role));addTaskBtn.classList.toggle'
          assert old in s
          s=s.replace(old,new,1)

          # Render user-facing stored statuses in chosen language; raw DB values remain unchanged.
          s=s.replace('${esc(p.supervisor_status)}','${esc(displayText(p.supervisor_status))}')
          s=s.replace('${esc(p.cfo_status)}','${esc(displayText(p.cfo_status))}')

          # 5) Professional payment report engine inserted before task renderer.
          report_anchor='function renderTasks(){'
          report_js=r'''
const PAYMENT_REPORT_COLUMNS=[
 {key:"due_date",ar:"تاريخ الاستحقاق",en:"Due Date"},{key:"company",ar:"الشركة",en:"Company"},{key:"beneficiary",ar:"المستفيد",en:"Beneficiary"},{key:"amount",ar:"المبلغ",en:"Amount"},{key:"bank",ar:"حساب البنك",en:"Bank Account"},{key:"purpose",ar:"الغرض",en:"Purpose"},{key:"priority",ar:"الأولوية",en:"Priority"},{key:"documents_status",ar:"المستندات",en:"Documents"},{key:"supervisor_status",ar:"اعتماد المشرف",en:"Supervisor Approval"},{key:"cfo_status",ar:"اعتماد المدير المالي",en:"CFO Approval"},{key:"status",ar:"الحالة",en:"Status"},{key:"executed_at",ar:"تاريخ التنفيذ",en:"Execution Date"},{key:"posted_at",ar:"تاريخ الترحيل",en:"Posting Date"}
];
let lastPaymentReportRows=[];
function reportColumnLabel(c){return currentLang==='en'?c.en:c.ar}
function paymentReportValue(p,key){
 if(key==='bank')return bankLabel(p);if(key==='amount')return money(p.amount);if(['executed_at','posted_at'].includes(key))return p[key]?fmt(p[key]):'—';
 if(['priority','documents_status','supervisor_status','cfo_status','status'].includes(key))return displayText(p[key]||'—');return p[key]||'—'
}
function openPaymentReport(){
 if(!['CFO','Supervisor','BankAccountant'].includes(profile.role))return;
 const companies=[...new Set(payments.map(x=>x.company).filter(Boolean))].sort();
 const statuses=[...new Set(payments.map(x=>x.status).filter(Boolean))];
 const bankOpts=banks.map(b=>({value:b.id,label:`${b.bank_name} — ${b.account_name} (${b.company})`}));
 const cols=PAYMENT_REPORT_COLUMNS.map((c,i)=>`<label><input class="pr-col" type="checkbox" value="${c.key}" ${['due_date','company','beneficiary','amount','bank','status'].includes(c.key)?'checked':''}><span>${reportColumnLabel(c)}</span></label>`).join('');
 showModal('تقرير المدفوعات الاحترافي',`<div class="modal-grid">${input('pr_from','الفترة من','','date')}${input('pr_to','الفترة إلى','','date')}${select('pr_company','الشركة',[{value:'',label:'كل الشركات'},...companies.map(x=>({value:x,label:x}))])}${select('pr_status','الحالة',[{value:'',label:'كل الحالات'},...statuses.map(x=>({value:x,label:displayText(x)}))])}${select('pr_bank','حساب البنك',[{value:'',label:'كل الحسابات'},...bankOpts])}</div><div style="margin-top:12px"><b>${displayText('أعمدة التقرير')}</b><div class="report-columns">${cols}</div></div><div class="report-toolbar" style="margin-top:14px"><button class="btn primary" onclick="previewPaymentReport()">${displayText('معاينة التقرير')}</button><button class="btn" onclick="exportPaymentReportCsv()">${displayText('تصدير CSV')}</button><button class="btn" onclick="printPaymentReport()">${displayText('طباعة / PDF')}</button><button class="btn" onclick="copyPaymentReportEmailSummary()">${displayText('نسخ ملخص للبريد')}</button></div><div id="paymentReportOutput"></div>`);previewPaymentReport()
}
function selectedPaymentReportColumns(){const ks=[...document.querySelectorAll('.pr-col:checked')].map(x=>x.value);return PAYMENT_REPORT_COLUMNS.filter(c=>ks.includes(c.key))}
function filteredPaymentReportRows(){const f=val('pr_from'),t=val('pr_to'),co=val('pr_company'),st=val('pr_status'),bk=val('pr_bank');return payments.filter(p=>(!f||p.due_date>=f)&&(!t||p.due_date<=t)&&(!co||p.company===co)&&(!st||p.status===st)&&(!bk||p.bank_account_id===bk))}
function previewPaymentReport(){const out=document.getElementById('paymentReportOutput');if(!out)return;const cols=selectedPaymentReportColumns();const rows=filteredPaymentReportRows();lastPaymentReportRows=rows;const total=rows.reduce((a,p)=>a+Number(p.amount||0),0);out.innerHTML=`<div class="report-summary"><div class="card kpi"><span>${displayText('عدد الدفعات')}</span><b>${rows.length}</b></div><div class="card kpi"><span>${displayText('إجمالي المبلغ')}</span><b>${moneyHtml(total)}</b></div><div class="card kpi"><span>${displayText('الفترة من')}</span><b style="font-size:15px">${esc(val('pr_from')||'—')} → ${esc(val('pr_to')||'—')}</b></div></div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(reportColumnLabel(c))}</th>`).join('')}</tr></thead><tbody>${rows.map(p=>`<tr>${cols.map(c=>`<td>${c.key==='amount'?moneyHtml(p.amount):esc(paymentReportValue(p,c.key))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${Math.max(cols.length,1)}">—</td></tr>`}</tbody></table></div>`;applyLanguage(out)}
function csvCell(v){const x=String(v??'').replace(/"/g,'""');return `"${x}"`}
function exportPaymentReportCsv(){const cols=selectedPaymentReportColumns();const rows=filteredPaymentReportRows();const lines=[cols.map(c=>csvCell(reportColumnLabel(c))).join(',')];rows.forEach(p=>lines.push(cols.map(c=>csvCell(c.key==='amount'?Number(p.amount||0).toFixed(2):paymentReportValue(p,c.key))).join(',')));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Sanam_Payments_${val('pr_from')||'all'}_${val('pr_to')||'all'}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)}
function paymentReportPrintableHtml(){const cols=selectedPaymentReportColumns(),rows=filteredPaymentReportRows(),total=rows.reduce((a,p)=>a+Number(p.amount||0),0);return `<!doctype html><html lang="${currentLang}" dir="${currentLang==='en'?'ltr':'rtl'}"><head><meta charset="utf-8"><title>Sanam Finance - ${displayText('تقرير المدفوعات')}</title><style>body{font-family:Arial,Tahoma,sans-serif;padding:24px;color:#172033}h1{margin-bottom:4px}.meta{color:#667085;margin-bottom:18px}.summary{display:flex;gap:30px;margin:14px 0;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #d7dde5;padding:7px;text-align:${currentLang==='en'?'left':'right'}}th{background:#f3f5f8}.neg{color:#a43f3f;font-weight:700}@media print{button{display:none}}</style></head><body><h1>Sanam Finance Portal</h1><div class="meta">${displayText('تقرير المدفوعات الاحترافي')} | ${esc(val('pr_from')||'—')} → ${esc(val('pr_to')||'—')}</div><div class="summary"><span>${displayText('عدد الدفعات')}: ${rows.length}</span><span>${displayText('إجمالي المبلغ')}: ${money(total)}</span></div><table><thead><tr>${cols.map(c=>`<th>${esc(reportColumnLabel(c))}</th>`).join('')}</tr></thead><tbody>${rows.map(p=>`<tr>${cols.map(c=>`<td class="${c.key==='amount'&&Number(p.amount)<0?'neg':''}">${esc(paymentReportValue(p,c.key))}</td>`).join('')}</tr>`).join('')}</tbody></table></body></html>`}
function printPaymentReport(){const w=window.open('','_blank','noopener,noreferrer');if(!w)return alert(currentLang==='en'?'Popup was blocked.':'تم حظر النافذة المنبثقة.');w.document.open();w.document.write(paymentReportPrintableHtml());w.document.close();setTimeout(()=>w.print(),250)}
async function copyPaymentReportEmailSummary(){const rows=filteredPaymentReportRows(),total=rows.reduce((a,p)=>a+Number(p.amount||0),0);const txt=currentLang==='en'?`Sanam Payments Report\nPeriod: ${val('pr_from')||'All'} to ${val('pr_to')||'All'}\nPayments: ${rows.length}\nTotal: ${money(total)}`:`تقرير مدفوعات سنام\nالفترة: ${val('pr_from')||'الكل'} إلى ${val('pr_to')||'الكل'}\nعدد الدفعات: ${rows.length}\nالإجمالي: ${money(total)}`;try{await navigator.clipboard.writeText(txt);alert(currentLang==='en'?'Email summary copied.':'تم نسخ ملخص التقرير للبريد.')}catch(e){alert(txt)}}
'''
          if 'function openPaymentReport()' not in s:
              assert report_anchor in s
              s=s.replace(report_anchor,report_js+'\n'+report_anchor,1)

          # Apply selected language after every render, without changing database values.
          old='function renderAll(){renderBanks();renderPayments();renderTasks();renderClose();renderImprest();renderPerformance();renderOwnership();renderExceptions();renderDashboard()}'
          new='function renderAll(){renderBanks();renderPayments();renderTasks();renderClose();renderImprest();renderPerformance();renderOwnership();renderExceptions();renderDashboard();applyLanguage()}'
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Static validation before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['id="langBtn"','toggleLanguage()','const I18N_AR_EN=','id="paymentReportBtn"','function openPaymentReport()','function previewPaymentReport()','function exportPaymentReportCsv()','function printPaymentReport()','function copyPaymentReportEmailSummary()','supervisor_approve_payment','cfo_approve_payment','execute_payment','post_payment','function openBankModal','function openTaskModal','function openCloseModal','function openImprestModal','function openExceptionModal','negative-amount']
          missing=[x for x in required if x not in s]
          assert not missing, f'Missing protected features: {missing}'
          assert '${moneyHtml(n)}' not in s, 'recursive negative formatter regression'
          assert 'addEventListener("click",openBankModal)' not in s, 'duplicate add listener regression'
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if 'supabase-js' not in x)
          Path('/tmp/sanam-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/sanam-inline.js

      - name: Commit restored features
        run: |
          git config user.name 'Sanam Finance Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore professional payment reports and bilingual UI' || exit 0
          git push
