name: Validate Governed UX Planning SLA
on:
  push:
    branches: [feature-governed-ux-planning-sla-2026-09-16]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-governed-ux-planning-sla-2026-09-16
      - run: python scripts/patch_governed_ux_planning_sla_20260916.py
      - run: python scripts/fix_governed_patch_20260916.py
      - name: Validate
        run: |
          grep -q 'GOVERNED_UX_PLANNING_SLA_2026_09_16' index.html
          grep -q 'data-page="permissions"' index.html
          grep -q 'save_manual_daily_plan' index.html
          grep -q 'get_payment_accounting_queue' index.html
          grep -q 'cfo_override_payment_status' index.html
          grep -q 'get_visible_bank_liquidity' index.html
          grep -q 'get_bank_account_directory' index.html
          grep -q 'saveTaskTemplate' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit validated index
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Implement governed UX manual planning SLA and KPI [skip generated]'
          git push
