name: Fix Daily Plan selectInline
on:
  push:
    branches: [fix-daily-plan-button-20260917]
    paths:
      - 'scripts/fix_daily_plan_select_inline.py'
      - '.github/workflows/fix-daily-plan-select-inline.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-daily-plan-button-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotfix
        run: python scripts/fix_daily_plan_select_inline.py
      - name: Validate anchors
        run: |
          grep -q 'function selectInline' index.html
          grep -q 'async function openDailyPlan' index.html
          grep -q 'wcDailyPlanBtn' index.html
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip() and 'src=' not in x[:80]]
          Path('/tmp/app.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patched UI
        run: |
          git config user.name 'Sanam Finance Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Daily Plan button runtime error'
          git push origin HEAD:fix-daily-plan-button-20260917
