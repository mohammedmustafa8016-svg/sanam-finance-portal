name: Finance Operations Regression
on:
  push:
    branches:
      - feature-finance-ops-control-2026-09-14
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate protected baseline and new controls
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          sql=Path('supabase/migrations/20260914_finance_ops_control.sql').read_text()
          required_html=[
            'FINANCE_OPS_CONTROL_2026_09_14',
            'column-filter-row','installTableFilters','applyTableFilters',
            'آخر 4 أرقام','maskAccountNo',
            'supervisor_open_daily_plan','start_finance_task','complete_finance_task',
            'request_task_justification','submit_task_justification',
            'get_finance_team_performance',
            'monthly_close_tasks_owner_id_fkey','imprest_funds_custodian_id_fkey',
            'performanceBody','tracked_on_time_rate','close_completion_rate',
            'paymentReportBtn','openPaymentReport','deleteBankAccount','deleteRequestedPayment',
            'toggleLanguage','PAYMENT_REPORT_COLUMNS','negative-amount'
          ]
          required_sql=[
            'alter table public.tasks add column if not exists due_time',
            'create or replace function public.supervisor_open_daily_plan',
            "if v_role <> 'Supervisor'",
            'create or replace function public.complete_finance_task',
            'DELAY_JUSTIFICATION_REQUIRED',
            'create or replace function public.get_finance_team_performance',
            'إعداد وتوجيه خطة عمل الفريق اليومية',
            'insert into public.ownership_matrix'
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_sql if x not in sql]
          if missing: raise SystemExit('missing required controls: '+repr(missing))
          if 'moneyHtml(n)}' in html: raise SystemExit('negative amount recursion regression detected')
          if 'owner:profiles(full_name)' in html or 'custodian:profiles(full_name)' in html:
            raise SystemExit('ambiguous Supabase relation regression detected')
          print('protected baseline + finance ops static checks PASS')
          PY
      - name: Validate JavaScript syntax
        run: node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\\s\\S]*)<\\/script>/);if(!m)throw new Error('script block missing');new Function(m[1]);console.log('javascript syntax PASS')"
