name: Run bank modal patch

on:
  push:
    branches:
      - preview-button-fix
    paths:
      - .github/workflows/fix-bank-run.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-button-fix
      - name: Apply patch
        run: python scripts/fix_bank.py
      - name: Validate
        run: |
          grep -q 'function openBankModal(){' index.html
          grep -q 'sb.from("bank_accounts").insert(payload)' index.html
          if grep -q 'function openBankModal(){return}' index.html; then exit 1; fi
      - name: Commit
        run: |
          git config user.name 'Sanam Finance Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Implement bank account add modal and save flow'
          git push origin preview-button-fix
